<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkyFetch Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>🌤️ SkyFetch Weather Dashboard</h1>

  <!-- Search Section -->
  <div class="search-box">
    <input
      type="text"
      id="cityInput"
      placeholder="Enter city name"
    />
    <button id="searchBtn">Search</button>
  </div>

  <!-- Loading & Error -->
  <p id="loading" class="loading">Loading weather data...</p>
  <p id="error" class="error"></p>

  <!-- Weather Display -->
  <div id="weather">
    <h2 id="city"></h2>
    <img id="icon" alt="" />
    <p id="temperature"></p>
    <p id="description"></p>
  </div>

  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
